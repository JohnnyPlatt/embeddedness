<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embeddedness Review Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #05080f;
    --surface: #0d1520;
    --card: #111d2e;
    --border: #1a3050;
    --border-light: #233d5a;
    --text: #e8eef5;
    --muted: #5a7a96;
    --accent: #2a7fff;
    --accent-glow: rgba(42, 127, 255, 0.15);
    --accent-light: #82b8ff;
    --green: #1fd67a;
    --amber: #f5a623;
    --red: #f04b4b;
    --font-display: 'Syne', sans-serif;
    --font-body: 'Outfit', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(42,127,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(42,127,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── HEADER ── */
  .header {
    position: fixed; top: 0; left: 0; right: 0;
    height: 56px;
    background: rgba(5,8,15,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    z-index: 50;
  }

  .header-brand {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 800;
    color: var(--accent-light);
    letter-spacing: -0.02em;
  }

  .header-brand span { color: var(--muted); font-weight: 400; }

  .nav-tabs { display: flex; gap: 4px; }

  .nav-tab {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
    color: var(--muted);
  }

  .nav-tab.active {
    background: var(--accent-glow);
    color: var(--accent-light);
    border: 1px solid rgba(42,127,255,0.2);
  }

  .nav-tab:hover:not(.active) { color: var(--text); background: var(--card); }

  .btn-admin {
    font-family: var(--font-body);
    font-size: 12px;
    padding: 5px 14px;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-admin:hover { border-color: var(--border-light); color: var(--text); }

  /* ── LAYOUT ── */
  .app { padding-top: 56px; min-height: 100vh; position: relative; z-index: 1; }

  .view { display: none; }
  .view.active { display: block; }

  /* ── REVIEW VIEW ── */
  .review-layout { display: flex; height: calc(100vh - 56px); overflow: hidden; }

  .sidebar {
    width: 220px;
    background: rgba(13,21,32,0.8);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
    height: 100%;
  }

  .sidebar-progress { padding: 16px 14px; border-bottom: 1px solid var(--border); }
  .sidebar-progress-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 8px; }
  .progress-bar { background: var(--card); border-radius: 2px; height: 4px; }
  .progress-fill { background: var(--accent); height: 100%; border-radius: 2px; transition: width 0.4s ease; }
  .progress-count { color: var(--muted); font-size: 11px; font-family: var(--font-mono); margin-top: 5px; }

  .sidebar-cats { padding: 10px 8px; }

  .cat-btn {
    width: 100%; text-align: left;
    background: none; border: none;
    border-radius: 7px; padding: 9px 10px;
    cursor: pointer; margin-bottom: 2px;
    transition: background 0.15s;
  }
  .cat-btn:hover { background: var(--card); }
  .cat-btn.active { background: var(--accent-glow); border: 1px solid rgba(42,127,255,0.15); }

  .cat-btn-row { display: flex; justify-content: space-between; align-items: center; }
  .cat-btn-name { font-size: 12px; font-weight: 500; color: var(--muted); }
  .cat-btn.active .cat-btn-name { color: var(--accent-light); }
  .cat-score { font-size: 11px; font-family: var(--font-mono); font-weight: 500; }
  .cat-progress { color: #1e3550; font-size: 10px; margin-top: 2px; font-family: var(--font-mono); }

  /* ── MAIN PANEL ── */
  .main-panel { flex: 1; overflow-y: auto; padding: 28px 32px; height: 100%; }

  .panel-header { margin-bottom: 24px; }
  .panel-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .panel-subtitle { color: var(--muted); font-size: 13px; }

  .client-row { display: flex; gap: 14px; margin-bottom: 28px; flex-wrap: wrap; }
  .field-group { flex: 1; min-width: 170px; }
  .field-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; display: block; margin-bottom: 6px; }

  select, input[type="text"], textarea {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 13px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  select:focus, input:focus, textarea:focus { border-color: rgba(42,127,255,0.4); }
  select option { background: var(--card); }
  select.placeholder { color: var(--muted); }

  .q-card {
    background: var(--card);
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
    transition: border-color 0.2s;
  }
  .q-card.answered { border-color: rgba(42,127,255,0.15); }

  .q-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .q-label { color: var(--text); font-size: 14px; font-weight: 600; flex: 1; }
  .q-weight { color: #1e3550; font-size: 10px; font-family: var(--font-mono); margin-left: 10px; flex-shrink: 0; }

  .q-options { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }

  .q-option {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 8px 11px; border-radius: 7px;
    cursor: pointer; border: 1px solid transparent;
    transition: all 0.12s;
  }
  .q-option:hover { background: rgba(42,127,255,0.05); }
  .q-option.selected { background: rgba(42,127,255,0.08); border-color: rgba(42,127,255,0.25); }

  .q-option input[type="radio"] {
    width: auto; padding: 0; border: none; background: none;
    margin-top: 3px; flex-shrink: 0; accent-color: var(--accent);
  }
  .q-option-text { color: #94aec4; font-size: 13px; flex: 1; }
  .q-option.selected .q-option-text { color: var(--accent-light); }
  .q-option-pts { color: var(--muted); font-size: 11px; font-family: var(--font-mono); flex-shrink: 0; }

  .q-comment {
    resize: vertical; min-height: 52px;
    background: var(--bg);
    font-size: 12px; color: var(--muted);
  }

  .nav-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-bottom: 24px; }

  .btn { 
    font-family: var(--font-body); font-size: 14px; font-weight: 600;
    padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer;
    transition: all 0.15s;
  }
  .btn-secondary { background: var(--card); color: var(--muted); }
  .btn-secondary:hover { color: var(--text); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #1a6fe8; transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--border); cursor: default; transform: none; }
  .btn-next { background: var(--accent-glow); color: var(--accent-light); border: 1px solid rgba(42,127,255,0.2); }
  .btn-next:hover { background: rgba(42,127,255,0.2); }

  .error-msg { color: var(--red); font-size: 12px; margin-top: 6px; }

  /* ── SUCCESS STATE ── */
  .success-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; gap: 14px; text-align: center; padding: 40px;
  }
  .success-icon {
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(31,214,122,0.1); border: 1px solid rgba(31,214,122,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  .success-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--green); }
  .success-sub { color: var(--muted); font-size: 14px; }

  /* ── DASHBOARD ── */
  .dashboard-panel { padding: 28px 32px; }

  .dashboard-controls { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
  .dashboard-controls select { max-width: 260px; }

  .score-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 22px; }

  .score-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 12px;
    text-align: center;
    transition: border-color 0.2s;
  }
  .score-card:hover { border-color: var(--border-light); }
  .score-value { font-family: var(--font-mono); font-size: 28px; font-weight: 500; }
  .score-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }

  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 22px; }
  @media (max-width: 800px) { .charts-row { grid-template-columns: 1fr; } }

  .chart-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px 20px;
  }
  .chart-wrap { position: relative; height: 240px; width: 100%; }
  .chart-title { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 14px; }
  .chart-placeholder {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 200px; color: var(--muted); gap: 8px;
  }
  .chart-placeholder-icon { font-size: 28px; }
  .chart-placeholder-text { font-size: 13px; }

  .detail-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; margin-bottom: 22px; }
  .detail-title { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; }
  .detail-cat { margin-bottom: 18px; }
  .detail-cat-name { color: var(--accent); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .detail-q { background: var(--bg); border-radius: 7px; padding: 10px 13px; margin-bottom: 6px; }
  .detail-q-row { display: flex; justify-content: space-between; }
  .detail-q-label { color: #94aec4; font-size: 12px; }
  .detail-q-pts { color: var(--text); font-size: 12px; font-weight: 600; font-family: var(--font-mono); }
  .detail-q-answer { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .detail-q-comment { color: #3a5570; font-size: 11px; margin-top: 4px; font-style: italic; }
  .detail-q-empty { color: #1e3550; font-size: 11px; margin-top: 3px; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.8); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: 14px; padding: 28px;
    width: 480px; max-height: 80vh; overflow-y: auto;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
  .modal-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 22px; line-height: 1; }
  .modal-close:hover { color: var(--text); }

  .add-client-form { background: var(--card); border-radius: 9px; padding: 16px; margin-bottom: 18px; }
  .add-client-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
  .add-client-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .add-client-row input { flex: 1; min-width: 120px; }
  .btn-add { background: var(--accent); color: #fff; border: none; border-radius: 7px; padding: 10px 18px; cursor: pointer; font-family: var(--font-body); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .btn-add:hover { background: #1a6fe8; }
  .btn-add:disabled { background: var(--border); cursor: default; }

  .client-list { display: flex; flex-direction: column; gap: 6px; }
  .client-item { display: flex; justify-content: space-between; align-items: center; background: var(--card); border-radius: 7px; padding: 10px 13px; }
  .client-item-name { color: var(--text); font-size: 14px; font-weight: 600; }
  .client-item-csm { color: var(--muted); font-size: 12px; }
  .btn-remove { background: none; border: 1px solid var(--border); color: var(--red); border-radius: 5px; padding: 3px 10px; cursor: pointer; font-size: 12px; font-family: var(--font-body); }
  .btn-remove:hover { background: rgba(240,75,75,0.08); }

  .admin-login { display: flex; flex-direction: column; gap: 10px; }
  .admin-login input[type="password"] { font-size: 14px; }

  .empty-state { color: var(--muted); text-align: center; padding: 20px; font-size: 13px; }
  .loading-state { color: var(--muted); text-align: center; padding: 30px; font-size: 13px; }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--border-light); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite;
    margin-right: 8px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .no-review-state { color: var(--muted); text-align: center; padding: 60px; font-size: 14px; }

  .review-check-label {
    display: flex; align-items: center; gap: 7px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 12px; cursor: pointer;
    transition: border-color 0.15s; font-size: 13px;
  }
  .review-check-label:hover { border-color: var(--border-light); }
  .review-check-label input { accent-color: var(--accent); cursor: pointer; }
  .review-check-name { color: var(--text); font-weight: 500; }
  .review-check-csm { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-brand">Embeddedness <span>Review</span></div>
  <nav class="nav-tabs">
    <button class="nav-tab active" onclick="showView('review')">Score Entry</button>
    <button class="nav-tab" onclick="showView('dashboard')">Dashboard</button>
  </nav>
  <button class="btn-admin" onclick="openAdmin()">⚙ Admin</button>
</header>

<div class="app">

  <!-- REVIEW VIEW -->
  <div class="view active" id="view-review">
    <div class="review-layout" id="review-layout">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-progress">
          <div class="sidebar-progress-label">Progress</div>
          <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
          <div class="progress-count" id="progress-count">0 / 26</div>
        </div>
        <div class="sidebar-cats" id="sidebar-cats"></div>
      </div>
      <!-- Main -->
      <div class="main-panel" id="main-panel">
        <div class="client-row">
          <div class="field-group">
            <label class="field-label">Client</label>
            <select id="sel-client" class="placeholder" onchange="onClientChange()">
              <option value="">Select client...</option>
            </select>
          </div>
          <div class="field-group">
            <label class="field-label">Your Name</label>
            <input type="text" id="inp-csm" placeholder="Enter your name">
          </div>
          <div class="field-group">
            <label class="field-label">Review Name</label>
            <input type="text" id="inp-review-name" placeholder="e.g. Q2 2026">
          </div>
        </div>
        <div id="questions-container"></div>
        <div class="nav-footer">
          <div style="display:flex;gap:8px">
            <button class="btn btn-secondary" id="btn-prev" onclick="prevCat()" style="display:none">← Back</button>
            <button class="btn btn-next" id="btn-next" onclick="nextCat()">Next →</button>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
            <div class="error-msg" id="submit-error"></div>
            <button class="btn btn-primary" id="btn-submit" style="display:none" onclick="submitReview()">Submit Review</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Success state -->
    <div class="success-state" id="success-state" style="display:none">
      <div class="success-icon">✓</div>
      <div class="success-title">Review Submitted</div>
      <div class="success-sub" id="success-sub"></div>
      <button class="btn btn-primary" style="margin-top:12px" onclick="resetReview()">Start New Review</button>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div class="view" id="view-dashboard">
    <div class="dashboard-panel">
      <div class="dashboard-controls">
        <select id="dash-client" class="placeholder" style="max-width:260px" onchange="loadDashboard()">
          <option value="">Select a client...</option>
        </select>
        <select id="dash-review" style="max-width:280px;display:none" onchange="renderDashboard()"></select>
      </div>
      <div id="review-check-panel" style="display:none;flex-wrap:wrap;gap:8px;padding:0 32px 16px;align-items:center;">
        <span style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:0.1em;margin-right:4px;">Compare:</span>
        <div id="review-checks" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
      </div>
      <div id="dashboard-content">
        <div class="no-review-state">Select a client to view their embeddedness scores.</div>
      </div>
    </div>
  </div>

</div>

<!-- ADMIN MODAL -->
<div class="modal-overlay" id="admin-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Admin Access</div>
      <button class="modal-close" onclick="closeAdmin()">×</button>
    </div>
    <!-- Login screen -->
    <div id="admin-login-screen">
      <div class="admin-login">
        <input type="password" id="admin-pwd" placeholder="Password" onkeydown="if(event.key==='Enter')tryAdminLogin()">
        <div class="error-msg" id="admin-error"></div>
        <button class="btn btn-primary" onclick="tryAdminLogin()">Enter</button>
      </div>
    </div>
    <!-- Management screen -->
    <div id="admin-mgmt-screen" style="display:none">
      <div class="add-client-form">
        <div class="add-client-label">Add New Client</div>
        <div class="add-client-row">
          <input type="text" id="new-client-name" placeholder="Client name">
          <input type="text" id="new-csm-name" placeholder="CSM owner">
          <button class="btn-add" id="btn-add-client" onclick="addClient()">Add</button>
        </div>
        <div class="error-msg" id="add-error"></div>
      </div>
      <div id="client-list-container">
        <div class="loading-state"><span class="spinner"></span>Loading...</div>
      </div>
    </div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const AIRTABLE_TOKEN = "patJhKzYQqtyi7UXU.306af9969fc810378141172b95ed6a985255e61724e8d8bac9ba61c9af1a4652";

// ── QUESTION DATA ─────────────────────────────────────────────────────────────

  "Advocacy":"Advocacy","Differentiators":"Differ.","Technical Health":"Tech Health","Contractual":"Contractual"
};

  adminAuthed: false,
  dashReviews: []
};

// ── AIRTABLE API ──────────────────────────────────────────────────────────────
async function atFetch(method, path, body) {
  const url = `https://api.airtable.com/v0/${BASE_ID}/${path}`;
  const opts = {
    method,
    headers: { "Authorization": `Bearer ${AIRTABLE_TOKEN}`, "Content-Type": "application/json" }
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (!res.ok) { const t = await res.text(); throw new Error(`${res.status}: ${t}`); }
  return res.json();
}

async function loadClients() {
  const data = await atFetch("GET", `${CLIENTS_TABLE}?maxRecords=200&sort[0][field]=Client%20Name&sort[0][direction]=asc`);
  state.clients = (data.records || []).map(r => ({ id: r.id, name: r.fields["Client Name"] || "", csm: r.fields["CSM Owner"] || "" }));
  return state.clients;
}

async function createClient(name, csm) {
  return atFetch("POST", CLIENTS_TABLE, { records: [{ fields: { "Client Name": name, "CSM Owner": csm } }] });
}

async function removeClient(id) {
  return atFetch("DELETE", `${CLIENTS_TABLE}/${id}`);
}

async function saveReview(client, csm, reviewName, answers, scores) {
  const fields = { Client: client, CSM: csm, "Review Date": new Date().toISOString().split("T")[0] };
  if (reviewName) fields["Review Name"] = reviewName;
  for (const cat of CATS) {
    for (const q of QUESTIONS[cat].questions) {
      if (answers[q.id] !== undefined) fields[q.id] = answers[q.id];
      if (answers[q.id + "_c"]) fields[q.id + "_comment"] = answers[q.id + "_c"];
    }
    if (scores[cat] !== undefined) fields[CAT_SCORE_FIELDS[cat]] = scores[cat];
  }
  return atFetch("POST", SCORES_TABLE, { records: [{ fields }] });
}

async function fetchReviews(clientName) {
  const f = encodeURIComponent(`{Client}="${clientName}"`);
  const data = await atFetch("GET", `${SCORES_TABLE}?filterByFormula=${f}&sort[0][field]=Review%20Date&sort[0][direction]=asc`);
  return data.records || [];
}

// ── SCORING ───────────────────────────────────────────────────────────────────
function calcScore(cat, answers) {
  let score = 0;
  for (const q of QUESTIONS[cat].questions) {
    const v = answers[q.id];
    if (v === undefined) continue;
    const opt = q.options.find(o => o.v === v);
    if (opt) score += (opt.pts / 100) * q.weight;
  }
  return Math.round(score * 100) / 100;
}

function calcAllScores(answers) {
  const s = {};
  CATS.forEach(c => { s[c] = calcScore(c, answers); });
  return s;
}

function scoreColor(pct) {
  if (pct >= 75) return "var(--green)";
  if (pct >= 50) return "var(--amber)";
  return "var(--red)";
}

// ── VIEW SWITCHING ────────────────────────────────────────────────────────────
function showView(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  document.querySelectorAll('.nav-tab')[v === 'review' ? 0 : 1].classList.add('active');
  if (v === 'dashboard') refreshDashClientSelect();
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
function buildSidebar() {
  const container = document.getElementById('sidebar-cats');
  container.innerHTML = '';
  CATS.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (cat === state.activeCat ? ' active' : '');
    btn.id = 'cat-btn-' + cat.replace(/\s/g,'_');
    const scores = calcAllScores(state.answers);
    const sc = Math.round(scores[cat] * 100);
    const done = QUESTIONS[cat].questions.filter(q => state.answers[q.id] !== undefined).length;
    const total = QUESTIONS[cat].questions.length;
    btn.innerHTML = `<div class="cat-btn-row">
      <span class="cat-btn-name">${cat}</span>
      ${done > 0 ? `<span class="cat-score" style="color:${scoreColor(sc)}">${sc}%</span>` : ''}
    </div>
    <div class="cat-progress">${done}/${total} answered</div>`;
    btn.onclick = () => switchCat(cat);
    container.appendChild(btn);
  });
  updateProgress();
}

function updateProgress() {
  const answered = CATS.reduce((a,c) => a + QUESTIONS[c].questions.filter(q => state.answers[q.id] !== undefined).length, 0);
  document.getElementById('progress-fill').style.width = (answered / TOTAL_QS * 100) + '%';
  document.getElementById('progress-count').textContent = `${answered} / ${TOTAL_QS}`;
}

function switchCat(cat) {
  state.activeCat = cat;
  buildSidebar();
  renderQuestions();
  updateNavButtons();
}

// ── QUESTIONS ─────────────────────────────────────────────────────────────────
function renderQuestions() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';

  const cat = state.activeCat;
  const qs = QUESTIONS[cat].questions;

  const hdr = document.createElement('div');
  hdr.className = 'panel-header';
  hdr.innerHTML = `<div class="panel-title">${cat}</div><div class="panel-subtitle">Select the descriptor that best fits the current state for this client.</div>`;
  container.appendChild(hdr);

  qs.forEach(q => {
    const card = document.createElement('div');
    card.className = 'q-card' + (state.answers[q.id] !== undefined ? ' answered' : '');
    card.id = 'qcard-' + q.id;

    let optionsHTML = q.options.map(opt => `
      <label class="q-option${state.answers[q.id] === opt.v ? ' selected' : ''}" id="opt-${q.id}-${opt.v}">
        <input type="radio" name="${q.id}" value="${opt.v}" ${state.answers[q.id] === opt.v ? 'checked' : ''} onchange="selectOption('${q.id}', ${opt.v})">
        <span class="q-option-text">${opt.label}</span>
        <span class="q-option-pts">${opt.pts}pts</span>
      </label>`).join('');

    card.innerHTML = `
      <div class="q-header">
        <div class="q-label">${q.label}</div>
        <div class="q-weight">wt ${Math.round(q.weight*100)}%</div>
      </div>
      <div class="q-options">${optionsHTML}</div>
      <textarea class="q-comment" placeholder="Add context or notes (optional)..." onchange="setComment('${q.id}', this.value)">${state.answers[q.id+'_c'] || ''}</textarea>`;
    container.appendChild(card);
  });
}

function selectOption(qid, val) {
  state.answers[qid] = val;
  // Update visual state
  document.querySelectorAll(`[id^="opt-${qid}-"]`).forEach(el => el.classList.remove('selected'));
  document.getElementById(`opt-${qid}-${val}`).classList.add('selected');
  document.getElementById('qcard-' + qid).classList.add('answered');
  buildSidebar();
}

function setComment(qid, val) {
  state.answers[qid + '_c'] = val;
}

function updateNavButtons() {
  const idx = CATS.indexOf(state.activeCat);
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  const btnSubmit = document.getElementById('btn-submit');
  btnPrev.style.display = idx > 0 ? 'inline-block' : 'none';
  if (idx === CATS.length - 1) {
    btnNext.style.display = 'none';
    btnSubmit.style.display = 'inline-block';
  } else {
    btnNext.style.display = 'inline-block';
    btnSubmit.style.display = 'none';
  }
}

function nextCat() {
  const idx = CATS.indexOf(state.activeCat);
  if (idx < CATS.length - 1) switchCat(CATS[idx + 1]);
}

function prevCat() {
  const idx = CATS.indexOf(state.activeCat);
  if (idx > 0) switchCat(CATS[idx - 1]);
}

// ── SUBMIT ────────────────────────────────────────────────────────────────────
async function submitReview() {
  const client = document.getElementById('sel-client').value;
  const csm = document.getElementById('inp-csm').value.trim();
  const errEl = document.getElementById('submit-error');
  errEl.textContent = '';

  if (!client) { errEl.textContent = 'Please select a client.'; return; }
  if (!csm) { errEl.textContent = 'Please enter your name.'; return; }

  const answered = CATS.reduce((a,c) => a + QUESTIONS[c].questions.filter(q => state.answers[q.id] !== undefined).length, 0);
  if (answered < TOTAL_QS && !confirm(`${TOTAL_QS - answered} question(s) unanswered. Submit anyway?`)) return;

  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = 'Submitting...';

  try {
    const scores = calcAllScores(state.answers);
    const reviewName = document.getElementById('inp-review-name').value.trim();
    await saveReview(client, csm, reviewName, state.answers, scores);
    document.getElementById('review-layout').style.display = 'none';
    const ss = document.getElementById('success-state');
    ss.style.display = 'flex';
    document.getElementById('success-sub').textContent = `${client} · ${new Date().toLocaleDateString('en-GB')}`;
  } catch(e) {
    errEl.textContent = 'Submission failed: ' + e.message;
    btn.disabled = false; btn.textContent = 'Submit Review';
  }
}

function resetReview() {
  state.answers = {};
  state.activeCat = CATS[0];
  document.getElementById('review-layout').style.display = 'flex';
  document.getElementById('success-state').style.display = 'none';
  document.getElementById('sel-client').value = '';
  document.getElementById('inp-csm').value = '';
  document.getElementById('inp-review-name').value = '';
  document.getElementById('btn-submit').disabled = false;
  document.getElementById('btn-submit').textContent = 'Submit Review';
  buildSidebar();
  renderQuestions();
  updateNavButtons();
}

// ── SVG CHART HELPERS ─────────────────────────────────────────────────────────
function makeRadarSVG(reviews) {
  const cats = Object.keys(CAT_SCORE_FIELDS);
  const n = cats.length;
  const cx = 200, cy = 185, r = 130;
  const COLORS = ['#2a7fff','#1fd67a','#f5a623','#a78bfa','#f04b4b','#06b6d4','#fb923c'];
  const FILLS  = ['rgba(42,127,255,0.12)','rgba(31,214,122,0.1)','rgba(245,166,35,0.1)','rgba(167,139,250,0.1)','rgba(240,75,75,0.1)','rgba(6,182,212,0.1)','rgba(251,146,60,0.1)'];

  // Grid rings
  let gridLines = '';
  [25,50,75,100].forEach(pct => {
    const rr = r * pct / 100;
    const pts = cats.map((_,i) => {
      const a = (i/n)*2*Math.PI - Math.PI/2;
      return `${cx+rr*Math.cos(a)},${cy+rr*Math.sin(a)}`;
    }).join(' ');
    gridLines += `<polygon points="${pts}" fill="none" stroke="#1a3050" stroke-width="1"/>`;
    gridLines += `<text x="${cx+4}" y="${cy-rr+3}" font-size="8" fill="#1e3550" font-family="DM Mono,monospace">${pct}</text>`;
  });

  // Axis lines
  const axisLines = cats.map((_,i) => {
    const a = (i/n)*2*Math.PI - Math.PI/2;
    return `<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(a)}" y2="${cy+r*Math.sin(a)}" stroke="#1a3050" stroke-width="1"/>`;
  }).join('');

  // Data polygons — one per review
  const polygons = reviews.map((rev, ri) => {
    const f = rev.fields;
    const pts = cats.map((cat,i) => {
      const val = f[CAT_SCORE_FIELDS[cat]] || 0;
      const a = (i/n)*2*Math.PI - Math.PI/2;
      return `${cx+r*val*Math.cos(a)},${cy+r*val*Math.sin(a)}`;
    }).join(' ');
    const dots = cats.map((cat,i) => {
      const val = f[CAT_SCORE_FIELDS[cat]] || 0;
      const a = (i/n)*2*Math.PI - Math.PI/2;
      return `<circle cx="${cx+r*val*Math.cos(a)}" cy="${cy+r*val*Math.sin(a)}" r="3" fill="${COLORS[ri]}"/>`;
    }).join('');
    return `<polygon points="${pts}" fill="${FILLS[ri]}" stroke="${COLORS[ri]}" stroke-width="2"/>${dots}`;
  }).join('');

  // Axis labels (use last selected review for pct colour)
  const lastF = reviews[reviews.length-1].fields;
  const labels = cats.map((cat,i) => {
    const a = (i/n)*2*Math.PI - Math.PI/2;
    const lr = r + 26;
    const lx = cx + lr*Math.cos(a);
    const ly = cy + lr*Math.sin(a);
    const pct = Math.round((lastF[CAT_SCORE_FIELDS[cat]]||0)*100);
    const col = pct>=75?'#1fd67a':pct>=50?'#f5a623':'#f04b4b';
    return `<text x="${lx}" y="${ly-5}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#5a7a96" font-family="Outfit,sans-serif">${CAT_SHORT[cat]}</text>
            <text x="${lx}" y="${ly+8}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="${col}" font-family="DM Mono,monospace" font-weight="500">${pct}%</text>`;
  }).join('');

  // Legend for multiple reviews
  const legendH = reviews.length > 1 ? reviews.length * 18 + 10 : 0;
  const legend = reviews.length > 1 ? reviews.map((rev,ri) => {
    const name = rev.fields["Review Name"] || rev.fields["Review Date"] || `Review ${ri+1}`;
    return `<rect x="10" y="${390+ri*18}" width="12" height="12" rx="2" fill="${COLORS[ri]}"/>
            <text x="26" y="${400+ri*18}" font-size="11" fill="#5a7a96" font-family="Outfit,sans-serif">${name}</text>`;
  }).join('') : '';

  const totalH = 390 + legendH;
  return `<svg width="400" height="${totalH}" viewBox="0 0 400 ${totalH}" style="width:100%;max-width:400px;display:block;margin:0 auto">
    ${gridLines}${axisLines}${polygons}${labels}${legend}
  </svg>`;
}

function makeTrendSVG(reviews) {
  if (reviews.length < 2) return '<div class="chart-placeholder"><div class="chart-placeholder-icon">📈</div><div class="chart-placeholder-text">Trend available after 2+ reviews</div></div>';
  
  const W = 500, H = 260, PAD = { top: 20, right: 20, bottom: 40, left: 35 };
  const plotW = W - PAD.left - PAD.right;
  const plotH = H - PAD.top - PAD.bottom;
  const cats = Object.keys(CAT_SCORE_FIELDS);
  const colors = ['#2a7fff','#1fd67a','#f5a623','#a78bfa','#f04b4b','#06b6d4','#fb923c'];
  const n = reviews.length;

  const xPos = i => PAD.left + (i / (n - 1)) * plotW;
  const yPos = v => PAD.top + plotH - (v / 100) * plotH;

  // Grid lines
  let grid = '';
  [0, 25, 50, 75, 100].forEach(v => {
    const y = yPos(v);
    grid += `<line x1="${PAD.left}" y1="${y}" x2="${W - PAD.right}" y2="${y}" stroke="#1a3050" stroke-width="1"/>`;
    grid += `<text x="${PAD.left - 4}" y="${y}" text-anchor="end" dominant-baseline="middle" font-size="9" fill="#3a5570" font-family="DM Mono,sans-serif">${v}</text>`;
  });

  // X labels
  let xLabels = reviews.map((r, i) => {
    const label = (r.fields["Review Date"] || `Rev ${i+1}`).slice(0, 10);
    return `<text x="${xPos(i)}" y="${H - 8}" text-anchor="middle" font-size="9" fill="#5a7a96" font-family="Outfit,sans-serif">${label}</text>`;
  }).join('');

  // Lines
  let lines = cats.map((cat, ci) => {
    const pts = reviews.map((r, i) => {
      const v = Math.round((r.fields[CAT_SCORE_FIELDS[cat]] || 0) * 100);
      return `${xPos(i)},${yPos(v)}`;
    }).join(' ');
    const dots = reviews.map((r, i) => {
      const v = Math.round((r.fields[CAT_SCORE_FIELDS[cat]] || 0) * 100);
      return `<circle cx="${xPos(i)}" cy="${yPos(v)}" r="3" fill="${colors[ci]}"/>`;
    }).join('');
    return `<polyline points="${pts}" fill="none" stroke="${colors[ci]}" stroke-width="2"/>${dots}`;
  }).join('');

  // Legend
  let legend = cats.map((cat, ci) => {
    const lx = PAD.left + (ci % 4) * 115;
    const ly = H + 15 + Math.floor(ci / 4) * 18;
    return `<rect x="${lx}" y="${ly - 5}" width="10" height="10" rx="2" fill="${colors[ci]}"/>
            <text x="${lx + 14}" y="${ly + 3}" font-size="10" fill="#5a7a96" font-family="Outfit,sans-serif">${CAT_SHORT[cat]}</text>`;
  }).join('');

  const totalH = H + 15 + Math.ceil(cats.length / 4) * 18 + 10;
  return `<svg width="${W}" height="${totalH}" viewBox="0 0 ${W} ${totalH}" style="width:100%;display:block">
    ${grid}${lines}${xLabels}${legend}
  </svg>`;
}

async function loadDashboard() {
  const client = document.getElementById('dash-client').value;
  const content = document.getElementById('dashboard-content');
  const reviewSel = document.getElementById('dash-review');

  if (!client) {
    content.innerHTML = '<div class="no-review-state">Select a client to view their embeddedness scores.</div>';
    reviewSel.style.display = 'none';
    document.getElementById('review-check-panel').style.display = 'none';
    return;
  }

  content.innerHTML = '<div class="loading-state"><span class="spinner"></span>Loading reviews...</div>';

  try {
    state.dashReviews = await fetchReviews(client);
    if (state.dashReviews.length === 0) {
      content.innerHTML = '<div class="no-review-state">No reviews submitted yet for this client.</div>';
      reviewSel.style.display = 'none';
      return;
    }
    reviewSel.style.display = 'inline-block';
    // Build checkbox list for multi-review radar
    const checkContainer = document.getElementById('review-checks');
    checkContainer.innerHTML = state.dashReviews.map((r, i) => {
      const label = r.fields["Review Name"] || r.fields["Review Date"] || `Review ${i+1}`;
      const csm = r.fields.CSM || '';
      const checked = i === state.dashReviews.length - 1 ? 'checked' : '';
      return `<label class="review-check-label">
        <input type="checkbox" value="${i}" ${checked} onchange="renderDashboard()">
        <span class="review-check-name">${label}</span>
        <span class="review-check-csm">${csm}</span>
      </label>`;
    }).join('');
    reviewSel.style.display = 'none';
    document.getElementById('review-check-panel').style.display = 'flex';
    renderDashboard();
  } catch(e) {
    content.innerHTML = `<div class="no-review-state">Error loading reviews: ${e.message}</div>`;
  }
}

function renderDashboard() {
  // Get selected review indices from checkboxes
  const checked = [...document.querySelectorAll('#review-checks input[type=checkbox]:checked')].map(cb => parseInt(cb.value));
  if (checked.length === 0) return;
  // Primary review is the last checked one for score cards and detail
  const idx = checked[checked.length - 1];
  const review = state.dashReviews[idx];
  if (!review) return;
  const f = review.fields;
  const selectedReviews = checked.map(i => state.dashReviews[i]);
  const content = document.getElementById('dashboard-content');

  // Scores object for radar
  const scores = {};
  Object.keys(CAT_SCORE_FIELDS).forEach(cat => { scores[cat] = f[CAT_SCORE_FIELDS[cat]] || 0; });

  // Score cards
  let scoreCardsHTML = Object.keys(CAT_SCORE_FIELDS).map(cat => {
    const pct = Math.round((f[CAT_SCORE_FIELDS[cat]] || 0) * 100);
    return `<div class="score-card">
      <div class="score-value" style="color:${scoreColor(pct)}">${pct}%</div>
      <div class="score-label">${CAT_SHORT[cat]}</div>
    </div>`;
  }).join('');

  // Detail
  let detailHTML = CATS.map(cat => {
    const qs = QUESTIONS[cat].questions.map(q => {
      const val = f[q.id];
      const opt = val ? q.options.find(o => o.v === val) : null;
      const comment = f[q.id + '_comment'];
      return `<div class="detail-q">
        <div class="detail-q-row">
          <span class="detail-q-label">${q.label}</span>
          ${opt ? `<span class="detail-q-pts">${opt.pts}pts</span>` : ''}
        </div>
        ${opt ? `<div class="detail-q-answer">${opt.label}</div>` : '<div class="detail-q-empty">Not answered</div>'}
        ${comment ? `<div class="detail-q-comment">"${comment}"</div>` : ''}
      </div>`;
    }).join('');
    return `<div class="detail-cat">
      <div class="detail-cat-name">${cat}</div>${qs}
    </div>`;
  }).join('');

  content.innerHTML = `
    <div class="score-grid">${scoreCardsHTML}</div>
    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title">Category Scores — Current Review</div>
        ${makeRadarSVG(selectedReviews)}
      </div>
      <div class="chart-card">
        <div class="chart-title">Score Development Over Time</div>
        ${makeTrendSVG(state.dashReviews)}
      </div>
    </div>
    <div class="detail-card">
      <div class="detail-title">Question Detail</div>
      ${detailHTML}
    </div>`;
}

// ── ADMIN ─────────────────────────────────────────────────────────────────────
function openAdmin() {
  document.getElementById('admin-modal').classList.add('open');
  if (state.adminAuthed) {
    showAdminMgmt();
  } else {
    document.getElementById('admin-login-screen').style.display = 'block';
    document.getElementById('admin-mgmt-screen').style.display = 'none';
    document.getElementById('modal-title').textContent = 'Admin Access';
    setTimeout(() => document.getElementById('admin-pwd').focus(), 100);
  }
}

function closeAdmin() {
  document.getElementById('admin-modal').classList.remove('open');
  document.getElementById('admin-pwd').value = '';
  document.getElementById('admin-error').textContent = '';
}

function tryAdminLogin() {
  const pwd = document.getElementById('admin-pwd').value;
  if (pwd === ADMIN_PASSWORD) {
    state.adminAuthed = true;
    showAdminMgmt();
  } else {
    document.getElementById('admin-error').textContent = 'Incorrect password';
    document.getElementById('admin-pwd').value = '';
  }
}

async function showAdminMgmt() {
  document.getElementById('admin-login-screen').style.display = 'none';
  document.getElementById('admin-mgmt-screen').style.display = 'block';
  document.getElementById('modal-title').textContent = 'Client Management';
  await refreshClientList();
}

async function refreshClientList() {
  const container = document.getElementById('client-list-container');
  container.innerHTML = '<div class="loading-state"><span class="spinner"></span>Loading...</div>';
  try {
    await loadClients();
    populateClientSelects();
    if (state.clients.length === 0) {
      container.innerHTML = '<div class="empty-state">No clients yet — add one above.</div>';
      return;
    }
    container.innerHTML = '<div class="client-list">' +
      state.clients.map(c => `
        <div class="client-item">
          <div><div class="client-item-name">${c.name}</div><div class="client-item-csm">${c.csm}</div></div>
          <button class="btn-remove" onclick="deleteClient('${c.id}','${c.name}')">Remove</button>
        </div>`).join('') +
      '</div>';
  } catch(e) {
    container.innerHTML = `<div class="empty-state">Error: ${e.message}</div>`;
  }
}

async function addClient() {
  const name = document.getElementById('new-client-name').value.trim();
  const csm = document.getElementById('new-csm-name').value.trim();
  const errEl = document.getElementById('add-error');
  errEl.textContent = '';
  if (!name || !csm) { errEl.textContent = 'Both fields are required.'; return; }

  const btn = document.getElementById('btn-add-client');
  btn.disabled = true; btn.textContent = '...';

  try {
    await createClient(name, csm);
    document.getElementById('new-client-name').value = '';
    document.getElementById('new-csm-name').value = '';
    await refreshClientList();
  } catch(e) {
    errEl.textContent = 'Failed: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Add';
}

async function deleteClient(id, name) {
  if (!confirm(`Remove "${name}"?`)) return;
  try {
    await removeClient(id);
    await refreshClientList();
  } catch(e) {
    alert('Failed to remove: ' + e.message);
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  buildSidebar();
  renderQuestions();
  updateNavButtons();
  try {
    await loadClients();
    populateClientSelects();
  } catch(e) {
    console.warn('Could not load clients on init:', e.message);
  }
}

init();
</script>
