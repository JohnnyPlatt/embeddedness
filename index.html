<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embeddedness Review Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #05080f;
    --surface: #0d1520;
    --card: #111d2e;
    --border: #1a3050;
    --border-light: #233d5a;
    --text: #e8eef5;
    --muted: #5a7a96;
    --accent: #2a7fff;
    --accent-glow: rgba(42, 127, 255, 0.15);
    --accent-light: #82b8ff;
    --green: #1fd67a;
    --amber: #f5a623;
    --red: #f04b4b;
    --font-display: 'Syne', sans-serif;
    --font-body: 'Outfit', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(42,127,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(42,127,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── HEADER ── */
  .header {
    position: fixed; top: 0; left: 0; right: 0;
    height: 56px;
    background: rgba(5,8,15,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    z-index: 50;
  }

  .header-brand {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 800;
    color: var(--accent-light);
    letter-spacing: -0.02em;
  }

  .header-brand span { color: var(--muted); font-weight: 400; }

  .nav-tabs { display: flex; gap: 4px; }

  .nav-tab {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
    color: var(--muted);
  }

  .nav-tab.active {
    background: var(--accent-glow);
    color: var(--accent-light);
    border: 1px solid rgba(42,127,255,0.2);
  }

  .nav-tab:hover:not(.active) { color: var(--text); background: var(--card); }

  .btn-admin {
    font-family: var(--font-body);
    font-size: 12px;
    padding: 5px 14px;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-admin:hover { border-color: var(--border-light); color: var(--text); }

  /* ── LAYOUT ── */
  .app { padding-top: 56px; min-height: 100vh; position: relative; z-index: 1; }

  .view { display: none; }
  .view.active { display: block; }

  /* ── REVIEW VIEW ── */
  .review-layout { display: flex; height: calc(100vh - 56px); overflow: hidden; }

  .sidebar {
    width: 220px;
    background: rgba(13,21,32,0.8);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
    height: 100%;
  }

  .sidebar-progress { padding: 16px 14px; border-bottom: 1px solid var(--border); }
  .sidebar-progress-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 8px; }
  .progress-bar { background: var(--card); border-radius: 2px; height: 4px; }
  .progress-fill { background: var(--accent); height: 100%; border-radius: 2px; transition: width 0.4s ease; }
  .progress-count { color: var(--muted); font-size: 11px; font-family: var(--font-mono); margin-top: 5px; }

  .sidebar-cats { padding: 10px 8px; }

  .cat-btn {
    width: 100%; text-align: left;
    background: none; border: none;
    border-radius: 7px; padding: 9px 10px;
    cursor: pointer; margin-bottom: 2px;
    transition: background 0.15s;
  }
  .cat-btn:hover { background: var(--card); }
  .cat-btn.active { background: var(--accent-glow); border: 1px solid rgba(42,127,255,0.15); }

  .cat-btn-row { display: flex; justify-content: space-between; align-items: center; }
  .cat-btn-name { font-size: 12px; font-weight: 500; color: var(--muted); }
  .cat-btn.active .cat-btn-name { color: var(--accent-light); }
  .cat-score { font-size: 11px; font-family: var(--font-mono); font-weight: 500; }
  .cat-progress { color: #1e3550; font-size: 10px; margin-top: 2px; font-family: var(--font-mono); }

  /* ── MAIN PANEL ── */
  .main-panel { flex: 1; overflow-y: auto; padding: 28px 32px; height: 100%; }

  .panel-header { margin-bottom: 24px; }
  .panel-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .panel-subtitle { color: var(--muted); font-size: 13px; }

  .client-row { display: flex; gap: 14px; margin-bottom: 28px; flex-wrap: wrap; }
  .field-group { flex: 1; min-width: 170px; }
  .field-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; display: block; margin-bottom: 6px; }

  select, input[type="text"], textarea {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 13px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  select:focus, input:focus, textarea:focus { border-color: rgba(42,127,255,0.4); }
  select option { background: var(--card); }
  select.placeholder { color: var(--muted); }

  .q-card {
    background: var(--card);
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
    transition: border-color 0.2s;
  }
  .q-card.answered { border-color: rgba(42,127,255,0.15); }

  .q-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .q-label { color: var(--text); font-size: 14px; font-weight: 600; flex: 1; }
  .q-weight { color: #1e3550; font-size: 10px; font-family: var(--font-mono); margin-left: 10px; flex-shrink: 0; }

  /* Slider styles */
  .slider-row { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  
  .slider-track { flex: 1; position: relative; }
  
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 2px;
    background: var(--border); outline: none;
    border: none; padding: 0; cursor: pointer;
    transition: background 0.2s;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 3px rgba(42,127,255,0.2);
    transition: box-shadow 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover {
    box-shadow: 0 0 0 5px rgba(42,127,255,0.25);
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
    border: 2px solid var(--bg);
  }

  .slider-steps { display: flex; justify-content: space-between; margin-top: 5px; padding: 0 1px; }
  .slider-step { font-size: 9px; font-family: var(--font-mono); color: #1e3550; }
  .slider-step.active { color: var(--accent-light); }

  .slider-badge {
    flex-shrink: 0; width: 36px; height: 36px; border-radius: 8px;
    background: var(--accent-glow); border: 1px solid rgba(42,127,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 14px; font-weight: 500;
    color: var(--accent-light);
  }
  .slider-badge.unanswered { background: var(--card); border-color: var(--border); color: var(--muted); }

  .slider-descriptor {
    min-height: 38px; padding: 8px 12px;
    background: rgba(42,127,255,0.05);
    border-left: 2px solid var(--accent);
    border-radius: 0 6px 6px 0;
    color: var(--accent-light); font-size: 13px;
    margin-bottom: 10px;
    transition: all 0.15s;
  }
  .slider-descriptor.unanswered {
    background: var(--bg); border-left-color: var(--border);
    color: var(--muted); font-style: italic;
  }
  .slider-pts {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--muted); margin-top: 3px;
  }

  .q-comment {
    resize: vertical; min-height: 52px;
    background: var(--bg);
    font-size: 12px; color: var(--muted);
  }

  .nav-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-bottom: 24px; }

  .btn { 
    font-family: var(--font-body); font-size: 14px; font-weight: 600;
    padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer;
    transition: all 0.15s;
  }
  .btn-secondary { background: var(--card); color: var(--muted); }
  .btn-secondary:hover { color: var(--text); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #1a6fe8; transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--border); cursor: default; transform: none; }
  .btn-next { background: var(--accent-glow); color: var(--accent-light); border: 1px solid rgba(42,127,255,0.2); }
  .btn-next:hover { background: rgba(42,127,255,0.2); }

  .error-msg { color: var(--red); font-size: 12px; margin-top: 6px; }

  /* ── SUCCESS STATE ── */
  .success-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; gap: 14px; text-align: center; padding: 40px;
  }
  .success-icon {
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(31,214,122,0.1); border: 1px solid rgba(31,214,122,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  .success-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--green); }
  .success-sub { color: var(--muted); font-size: 14px; }

  /* ── DASHBOARD ── */
  .dashboard-panel { padding: 28px 32px; }

  .dashboard-controls { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
  .dashboard-controls select { max-width: 260px; }

  .score-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 22px; }

  .score-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 12px;
    text-align: center;
    transition: border-color 0.2s;
  }
  .score-card:hover { border-color: var(--border-light); }
  .score-value { font-family: var(--font-mono); font-size: 28px; font-weight: 500; }
  .score-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }

  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 22px; }
  @media (max-width: 800px) { .charts-row { grid-template-columns: 1fr; } }

  .chart-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px 20px;
  }
  .chart-wrap { position: relative; height: 240px; width: 100%; }
  .chart-title { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 14px; }
  .chart-placeholder {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 200px; color: var(--muted); gap: 8px;
  }
  .chart-placeholder-icon { font-size: 28px; }
  .chart-placeholder-text { font-size: 13px; }

  .detail-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; margin-bottom: 22px; }
  .detail-title { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; }
  .detail-cat { margin-bottom: 18px; }
  .detail-cat-name { color: var(--accent); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .detail-q { background: var(--bg); border-radius: 7px; padding: 10px 13px; margin-bottom: 6px; }
  .detail-q-row { display: flex; justify-content: space-between; }
  .detail-q-label { color: #94aec4; font-size: 12px; }
  .detail-q-pts { color: var(--text); font-size: 12px; font-weight: 600; font-family: var(--font-mono); }
  .detail-q-answer { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .detail-q-comment { color: #3a5570; font-size: 11px; margin-top: 4px; font-style: italic; }
  .detail-q-empty { color: #1e3550; font-size: 11px; margin-top: 3px; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.8); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: 14px; padding: 28px;
    width: 480px; max-height: 80vh; overflow-y: auto;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
  .modal-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 22px; line-height: 1; }
  .modal-close:hover { color: var(--text); }

  .add-client-form { background: var(--card); border-radius: 9px; padding: 16px; margin-bottom: 18px; }
  .add-client-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
  .add-client-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .add-client-row input { flex: 1; min-width: 120px; }
  .btn-add { background: var(--accent); color: #fff; border: none; border-radius: 7px; padding: 10px 18px; cursor: pointer; font-family: var(--font-body); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .btn-add:hover { background: #1a6fe8; }
  .btn-add:disabled { background: var(--border); cursor: default; }

  .client-list { display: flex; flex-direction: column; gap: 6px; }
  .client-item { display: flex; justify-content: space-between; align-items: center; background: var(--card); border-radius: 7px; padding: 10px 13px; }
  .client-item-name { color: var(--text); font-size: 14px; font-weight: 600; }
  .client-item-csm { color: var(--muted); font-size: 12px; }
  .btn-remove { background: none; border: 1px solid var(--border); color: var(--red); border-radius: 5px; padding: 3px 10px; cursor: pointer; font-size: 12px; font-family: var(--font-body); }
  .btn-remove:hover { background: rgba(240,75,75,0.08); }

  .admin-login { display: flex; flex-direction: column; gap: 10px; }
  .admin-login input[type="password"] { font-size: 14px; }

  .empty-state { color: var(--muted); text-align: center; padding: 20px; font-size: 13px; }
  .loading-state { color: var(--muted); text-align: center; padding: 30px; font-size: 13px; }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--border-light); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite;
    margin-right: 8px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Admin tabs */
  .admin-tab-btn {
    font-family: var(--font-body); font-size: 13px; font-weight: 500;
    padding: 6px 16px; border: 1px solid var(--border); border-radius: 6px;
    background: none; color: var(--muted); cursor: pointer; transition: all 0.15s;
  }
  .admin-tab-btn.active { background: var(--accent-glow); color: var(--accent-light); border-color: rgba(42,127,255,0.3); }
  .admin-tab-btn:hover:not(.active) { color: var(--text); }

  /* Question editor */
  .q-admin-cat { margin-bottom: 20px; }
  .q-admin-cat-header {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--card); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px;
    cursor: pointer; border: 1px solid var(--border);
  }
  .q-admin-cat-name { color: var(--accent-light); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .q-admin-cat-toggle { color: var(--muted); font-size: 14px; }
  .q-admin-q {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 6px;
  }
  .q-admin-q-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .q-admin-q-label { color: var(--text); font-size: 13px; font-weight: 600; flex: 1; }
  .q-admin-q-actions { display: flex; gap: 5px; flex-shrink: 0; }
  .btn-q-edit { background: none; border: 1px solid var(--border); color: var(--accent-light); border-radius: 5px; padding: 3px 10px; cursor: pointer; font-size: 11px; font-family: var(--font-body); }
  .btn-q-edit:hover { background: var(--accent-glow); }
  .btn-q-archive { background: none; border: 1px solid var(--border); color: var(--amber); border-radius: 5px; padding: 3px 10px; cursor: pointer; font-size: 11px; font-family: var(--font-body); }
  .btn-q-archive:hover { background: rgba(245,166,35,0.08); }
  .q-admin-weight { color: var(--muted); font-size: 11px; font-family: var(--font-mono); margin-top: 3px; }
  .q-admin-options { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; }
  .q-admin-opt { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .q-admin-opt-v { font-family: var(--font-mono); color: var(--accent-light); width: 20px; flex-shrink: 0; }
  .q-admin-opt-pts { font-family: var(--font-mono); color: var(--green); width: 35px; flex-shrink: 0; }

  /* Question edit form */
  .q-edit-form { margin-top: 10px; background: var(--surface); border: 1px solid var(--border-light); border-radius: 8px; padding: 14px; display: none; }
  .q-edit-form.open { display: block; }
  .q-edit-row { margin-bottom: 10px; }
  .q-edit-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; display: block; margin-bottom: 4px; }
  .q-edit-row input, .q-edit-row textarea { font-size: 13px; }
  .q-edit-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .q-edit-opt-row { display: flex; gap: 6px; align-items: center; }
  .q-edit-opt-row input[type="text"] { flex: 1; }
  .q-edit-opt-row input[type="number"] { width: 70px; }
  .q-edit-opt-row .lbl { color: var(--muted); font-size: 11px; font-family: var(--font-mono); white-space: nowrap; }
  .btn-add-opt { background: none; border: 1px dashed var(--border-light); color: var(--muted); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 12px; width: 100%; margin-bottom: 8px; }
  .btn-add-opt:hover { border-color: var(--accent); color: var(--accent-light); }
  .btn-rm-opt { background: none; border: none; color: var(--red); cursor: pointer; font-size: 16px; line-height: 1; flex-shrink: 0; }
  .btn-save-q { background: var(--accent); color: #fff; border: none; border-radius: 7px; padding: 8px 20px; cursor: pointer; font-family: var(--font-body); font-weight: 600; font-size: 13px; }
  .btn-save-q:hover { background: #1a6fe8; }
  .btn-cancel-q { background: var(--card); color: var(--muted); border: none; border-radius: 7px; padding: 8px 16px; cursor: pointer; font-family: var(--font-body); font-size: 13px; }
  .btn-add-question { background: none; border: 1px dashed var(--border-light); color: var(--muted); border-radius: 7px; padding: 7px 14px; cursor: pointer; font-size: 12px; width: 100%; margin-top: 4px; }
  .btn-add-question:hover { border-color: var(--accent); color: var(--accent-light); }
  .btn-add-section { background: none; border: 1px dashed var(--border-light); color: var(--muted); border-radius: 7px; padding: 8px 14px; cursor: pointer; font-size: 12px; width: 100%; margin-bottom: 14px; }
  .btn-add-section:hover { border-color: var(--green); color: var(--green); }

  .no-review-state { color: var(--muted); text-align: center; padding: 60px; font-size: 14px; }

  /* Edit/delete buttons on review checkboxes */
  .review-check-actions { display: flex; gap: 5px; margin-left: auto; }
  .btn-edit-review {
    background: none; border: 1px solid var(--border);
    color: var(--accent-light); border-radius: 5px;
    padding: 2px 9px; cursor: pointer; font-size: 11px;
    font-family: var(--font-body); transition: all 0.15s;
  }
  .btn-edit-review:hover { background: var(--accent-glow); border-color: rgba(42,127,255,0.3); }
  .btn-del-review {
    background: none; border: 1px solid var(--border);
    color: var(--red); border-radius: 5px;
    padding: 2px 9px; cursor: pointer; font-size: 11px;
    font-family: var(--font-body); transition: all 0.15s;
  }
  .btn-del-review:hover { background: rgba(240,75,75,0.08); border-color: var(--red); }

  /* Edit mode banner in score entry */
  .edit-banner {
    background: rgba(245,166,35,0.1); border: 1px solid rgba(245,166,35,0.3);

// Runtime question schema — populated from Airtable, falls back to seed
let QUESTIONS = {};
let CATS = [];
let TOTAL_QS = 0;

function buildQuestionsFromRecords(records) {
  const schema = {};
  // Sort by category order then question order
  const active = records.filter(r => r.fields.Active !== false);
  active.sort((a,b) => (a.fields["Category Order"]||99) - (b.fields["Category Order"]||99) || (a.fields["Question Order"]||99) - (b.fields["Question Order"]||99));
  for (const r of active) {
    const cat = r.fields["Category"] || "Uncategorised";
    const code = r.fields["Category Code"] || cat.substring(0,3).toUpperCase();
    if (!schema[cat]) schema[cat] = { code, questions: [] };
    let options = [];
    try { options = JSON.parse(r.fields["Options JSON"] || "[]"); } catch(e) {}
    schema[cat].questions.push({
      id: r.fields["Question ID"],
      label: r.fields["Question Label"],
      weight: parseFloat(r.fields["Weight"] || 0.5),
      options,
      _recordId: r.id
    });
  }
  return schema;
}

function refreshQuestionMeta() {
  CATS = Object.keys(QUESTIONS);
  TOTAL_QS = CATS.reduce((a,c) => a + QUESTIONS[c].questions.length, 0);
}

// Category score field names in Airtable (fixed — tied to Scores table schema)
const CAT_SCORE_FIELDS = {
  "Business Case":"BC_Score","Journey Volumes":"Vol_Score","Engagement":"Eng_Score",
  "Advocacy":"Adv_Score","Differentiators":"Diff_Score","Technical Health":"TH_Score","Contractual":"Con_Score"
};

function getCatShort(cat) {
  const MAP = {
    "Business Case":"Biz Case","Journey Volumes":"Volumes","Engagement":"Engagement",
    "Advocacy":"Advocacy","Differentiators":"Differ.","Technical Health":"Tech Health","Contractual":"Contractual"
  };
  return MAP[cat] || (cat.length > 10 ? cat.substring(0,9)+'…' : cat);
}

// ── QUESTIONS API ─────────────────────────────────────────────────────────────
async function loadQuestions() {
  const data = await atFetch("GET", `${QUESTIONS_TABLE}?maxRecords=500&sort[0][field]=Category%20Order&sort[1][field]=Question%20Order`);
  const records = data.records || [];
  if (records.length === 0) {
    // Seed from hardcoded data on first run
    await seedQuestions();
    return loadQuestions();
  }
  QUESTIONS = buildQuestionsFromRecords(records);
  refreshQuestionMeta();
  return records;
}

async function seedQuestions() {
  const records = [];
  for (const [cat, catData] of Object.entries(SEED_QUESTIONS)) {
    for (const q of catData.questions) {
      records.push({ fields: {
        "Question ID": q.id,
        "Category": cat,
        "Category Order": catData.catOrder,
        "Question Label": q.label,
        "Question Order": q.order,
        "Weight": q.weight,
        "Options JSON": JSON.stringify(q.options),
        "Active": true
      }});
    }
  }
  // Airtable max 10 records per POST
  for (let i = 0; i < records.length; i += 10) {
    const result = await atFetch("POST", QUESTIONS_TABLE, { records: records.slice(i, i+10) });
    console.log(`Seeded batch ${i/10 + 1}:`, JSON.stringify(result).substring(0, 200));
  }
}

async function loadAllQuestionRecords() {
  const data = await atFetch("GET", `${QUESTIONS_TABLE}?maxRecords=500&sort[0][field]=Category%20Order&sort[1][field]=Question%20Order`);
  return data.records || [];
}

  return atFetch("PATCH", `${QUESTIONS_TABLE}/${recordId}`, { fields });
}

async function createQuestionRecord(fields) {
  return atFetch("POST", QUESTIONS_TABLE, { records: [{ fields }] });
}

async function archiveQuestionRecord(recordId) {

}

async function atFetch(method, path, body) {
  const url = `https://api.airtable.com/v0/${BASE_ID}/${path}`;
  const opts = {
    method,
    headers: { "Authorization": `Bearer ${AIRTABLE_TOKEN}`, "Content-Type": "application/json" }
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (!res.ok) { const t = await res.text(); throw new Error(`${res.status}: ${t}`); }
  return res.json();
}

async function loadClients() {
  const data = await atFetch("GET", `${CLIENTS_TABLE}?maxRecords=200&sort[0][field]=Client%20Name&sort[0][direction]=asc`);
  state.clients = (data.records || []).map(r => ({ id: r.id, name: r.fields["Client Name"] || "", csm: r.fields["CSM Owner"] || "" }));
  return state.clients;
}

async function createClient(name, csm) {
  return atFetch("POST", CLIENTS_TABLE, { records: [{ fields: { "Client Name": name, "CSM Owner": csm } }] });
}

async function removeClient(id) {
  return atFetch("DELETE", `${CLIENTS_TABLE}/${id}`);
}

async function saveReview(client, csm, reviewName, answers, scores) {
  const fields = { Client: client, CSM: csm, "Review Date": new Date().toISOString().split("T")[0] };
  if (reviewName) fields["Review Name"] = reviewName;
  for (const cat of CATS) {
    for (const q of QUESTIONS[cat].questions) {
      if (answers[q.id] !== undefined) fields[q.id] = answers[q.id];
      if (answers[q.id + "_c"]) fields[q.id + "_comment"] = answers[q.id + "_c"];
    }
    if (scores[cat] !== undefined) fields[CAT_SCORE_FIELDS[cat]] = scores[cat];
  }
  return atFetch("POST", SCORES_TABLE, { records: [{ fields }] });
}

async function fetchReviews(clientName) {
  const f = encodeURIComponent(`{Client}="${clientName}"`);
  const data = await atFetch("GET", `${SCORES_TABLE}?filterByFormula=${f}&sort[0][field]=Review%20Date&sort[0][direction]=asc`);
  return data.records || [];
}

async function deleteReview(recordId) {
  return atFetch("DELETE", `${SCORES_TABLE}/${recordId}`);
}

async function updateReview(recordId, client, csm, reviewName, answers, scores) {
  const fields = { Client: client, CSM: csm, "Review Date": new Date().toISOString().split("T")[0] };
  if (reviewName) fields["Review Name"] = reviewName;
  for (const cat of CATS) {
    for (const q of QUESTIONS[cat].questions) {
      if (answers[q.id] !== undefined) fields[q.id] = answers[q.id];
      if (answers[q.id + "_c"]) fields[q.id + "_comment"] = answers[q.id + "_c"];
    }
    if (scores[cat] !== undefined) fields[CAT_SCORE_FIELDS[cat]] = scores[cat];
  }
  return atFetch("PATCH", `${SCORES_TABLE}/${recordId}`, { fields });
}

// ── SCORING ───────────────────────────────────────────────────────────────────
function calcScore(cat, answers) {
  let score = 0;
  for (const q of QUESTIONS[cat].questions) {
    const v = answers[q.id];
    if (v === undefined) continue;
    const opt = q.options.find(o => o.v === v);
    if (opt) score += (opt.pts / 100) * q.weight;
  }
  return Math.round(score * 100) / 100;
}

function calcAllScores(answers) {
  const s = {};
  CATS.forEach(c => { s[c] = calcScore(c, answers); });
  return s;
}

function scoreColor(pct) {
  if (pct >= 75) return "var(--green)";
  if (pct >= 50) return "var(--amber)";
  return "var(--red)";
}

// ── VIEW SWITCHING ────────────────────────────────────────────────────────────
function showView(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  document.querySelectorAll('.nav-tab')[v === 'review' ? 0 : 1].classList.add('active');
  if (v === 'dashboard') refreshDashClientSelect();
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
function buildSidebar() {
  const container = document.getElementById('sidebar-cats');
  container.innerHTML = '';
  CATS.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (cat === state.activeCat ? ' active' : '');
    btn.id = 'cat-btn-' + cat.replace(/\s/g,'_');
    const scores = calcAllScores(state.answers);
    const sc = Math.round(scores[cat] * 100);
    const done = QUESTIONS[cat].questions.filter(q => state.answers[q.id] !== undefined).length;
    const total = QUESTIONS[cat].questions.length;
    btn.innerHTML = `<div class="cat-btn-row">
      <span class="cat-btn-name">${cat}</span>
      ${done > 0 ? `<span class="cat-score" style="color:${scoreColor(sc)}">${sc}%</span>` : ''}
    </div>
    <div class="cat-progress">${done}/${total} answered</div>`;
    btn.onclick = () => switchCat(cat);
    container.appendChild(btn);
  });
  updateProgress();
}

function updateProgress() {
  const answered = CATS.reduce((a,c) => a + QUESTIONS[c].questions.filter(q => state.answers[q.id] !== undefined).length, 0);
  document.getElementById('progress-fill').style.width = (answered / TOTAL_QS * 100) + '%';
  document.getElementById('progress-count').textContent = `${answered} / ${TOTAL_QS}`;
}

function switchCat(cat) {
  state.activeCat = cat;
  buildSidebar();
  renderQuestions();
  updateNavButtons();
}

// ── QUESTIONS ─────────────────────────────────────────────────────────────────
function renderQuestions() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';

  const cat = state.activeCat;
  const qs = QUESTIONS[cat].questions;

  const hdr = document.createElement('div');
  hdr.className = 'panel-header';
  hdr.innerHTML = `<div class="panel-title">${cat}</div><div class="panel-subtitle">Drag the slider to the position that best fits the current state for this client.</div>`;
  container.appendChild(hdr);

  qs.forEach(q => {
    const card = document.createElement('div');
    const hasAnswer = state.answers[q.id] !== undefined;
    card.className = 'q-card' + (hasAnswer ? ' answered' : '');
    card.id = 'qcard-' + q.id;

    const max = q.options.length;
    const curVal = state.answers[q.id] !== undefined ? state.answers[q.id] : 0;
    const curOpt = curVal ? q.options.find(o => o.v === curVal) : null;

    // Step markers
    const steps = q.options.map((opt, i) =>
      `<span class="slider-step${curVal === opt.v ? ' active' : ''}">${opt.v}</span>`
    ).join('');

    // Descriptor text
    const descText = curOpt ? curOpt.label : 'Move the slider to select…';
    const descPts = curOpt ? `${curOpt.pts} points` : '';
    const descClass = curOpt ? 'slider-descriptor' : 'slider-descriptor unanswered';
    const badgeClass = curOpt ? 'slider-badge' : 'slider-badge unanswered';
    const badgeText = curOpt ? `${curVal}/${max}` : '–';

    card.innerHTML = `
      <div class="q-header">
        <div class="q-label">${q.label}</div>
        <div class="q-weight">wt ${Math.round(q.weight*100)}%</div>
      </div>
      <div class="slider-row">
        <div class="slider-track">
          <input type="range" id="slider-${q.id}" min="1" max="${max}" step="1" value="${curVal || 1}"
            oninput="onSliderMove('${q.id}')" onchange="onSliderCommit('${q.id}')">
          <div class="slider-steps">${steps}</div>
        </div>
        <div class="${badgeClass}" id="badge-${q.id}">${badgeText}</div>
      </div>
      <div class="${descClass}" id="desc-${q.id}">
        <div id="desc-text-${q.id}">${descText}</div>
        <div class="slider-pts" id="desc-pts-${q.id}">${descPts}</div>
      </div>
      <textarea class="q-comment" placeholder="Add context or notes (optional)..." oninput="setComment('${q.id}', this.value)">${state.answers[q.id+'_c'] || ''}</textarea>`;
    container.appendChild(card);

    // Set slider track fill colour
    if (curVal) updateSliderFill(q.id, curVal, max);
  });
}

function updateSliderFill(qid, val, max) {
  const slider = document.getElementById('slider-' + qid);
  if (!slider) return;
  const pct = ((val - 1) / (max - 1)) * 100;
  slider.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--border) ${pct}%)`;
}

function onSliderMove(qid) {
  const slider = document.getElementById('slider-' + qid);
  const val = parseInt(slider.value);
  const q = findQuestion(qid);
  if (!q) return;
  const max = q.options.length;
  const opt = q.options.find(o => o.v === val);

  // Update descriptor live
  const descEl = document.getElementById('desc-' + qid);
  const descText = document.getElementById('desc-text-' + qid);
  const descPts = document.getElementById('desc-pts-' + qid);
  const badge = document.getElementById('badge-' + qid);

  if (opt) {
    descEl.className = 'slider-descriptor';
    descText.textContent = opt.label;
    descPts.textContent = opt.pts + ' points';
    badge.className = 'slider-badge';
    badge.textContent = val + '/' + max;
  }

  updateSliderFill(qid, val, max);

  // Update step markers
  const steps = document.querySelectorAll(`#qcard-${qid} .slider-step`);
  steps.forEach((s, i) => s.classList.toggle('active', i + 1 === val));
}

function onSliderCommit(qid) {
  const slider = document.getElementById('slider-' + qid);
  const val = parseInt(slider.value);
  state.answers[qid] = val;
  document.getElementById('qcard-' + qid).classList.add('answered');
  buildSidebar();
}

function findQuestion(qid) {
  for (const cat of Object.keys(QUESTIONS)) {
    const q = QUESTIONS[cat].questions.find(q => q.id === qid);
    if (q) return q;
  }
  return null;
}

function selectOption(qid, val) {
  // kept for compatibility
  state.answers[qid] = val;
  buildSidebar();
}

function setComment(qid, val) {
  state.answers[qid + '_c'] = val;
}

function updateNavButtons() {
  const idx = CATS.indexOf(state.activeCat);
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  const btnSubmit = document.getElementById('btn-submit');
  btnPrev.style.display = idx > 0 ? 'inline-block' : 'none';
  if (idx === CATS.length - 1) {
    btnNext.style.display = 'none';
    btnSubmit.style.display = 'inline-block';
  } else {
    btnNext.style.display = 'inline-block';
    btnSubmit.style.display = 'none';
  }
}

function nextCat() {
  const idx = CATS.indexOf(state.activeCat);
  if (idx < CATS.length - 1) switchCat(CATS[idx + 1]);
}

function prevCat() {
  const idx = CATS.indexOf(state.activeCat);
  if (idx > 0) switchCat(CATS[idx - 1]);
}

// ── EDIT / DELETE ─────────────────────────────────────────────────────────────
function startEditReview(e, idx) {
  e.preventDefault(); e.stopPropagation();
  const review = state.dashReviews[idx];
  if (!review) return;
  const f = review.fields;

  // Load answers from saved review back into state
  state.answers = {};
  for (const cat of CATS) {
    for (const q of QUESTIONS[cat].questions) {
      if (f[q.id] !== undefined) state.answers[q.id] = f[q.id];
      if (f[q.id + '_comment']) state.answers[q.id + '_c'] = f[q.id + '_comment'];
    }
  }
  state.editingRecordId = review.id;
  state.activeCat = CATS[0];

  // Populate form fields
  document.getElementById('sel-client').value = f.Client || '';
  document.getElementById('inp-csm').value = f.CSM || '';
  document.getElementById('inp-review-name').value = f["Review Name"] || '';

  // Show edit banner, switch to review tab
  document.getElementById('edit-banner').style.display = 'flex';
  document.getElementById('btn-submit').textContent = 'Save Changes';
  showView('review');
  buildSidebar();
  renderQuestions();
  updateNavButtons();
}

function cancelEdit() {
  state.editingRecordId = null;
  state.answers = {};
  document.getElementById('edit-banner').style.display = 'none';
  document.getElementById('btn-submit').textContent = 'Submit Review';
  document.getElementById('sel-client').value = '';
  document.getElementById('inp-csm').value = '';
  document.getElementById('inp-review-name').value = '';
  state.activeCat = CATS[0];
  buildSidebar();
  renderQuestions();
  updateNavButtons();
}

async function confirmDeleteReview(e, idx) {
  e.preventDefault(); e.stopPropagation();
  const review = state.dashReviews[idx];
  if (!review) return;
  const label = review.fields["Review Name"] || review.fields["Review Date"] || `Review ${idx+1}`;
  if (!confirm(`Delete "${label}"? This cannot be undone.`)) return;

  try {
    await deleteReview(review.id);
    // Reload dashboard for this client
    await loadDashboard();
  } catch(e) {
    alert('Delete failed: ' + e.message);
  }
}

// ── SUBMIT ────────────────────────────────────────────────────────────────────
async function submitReview() {
  const client = document.getElementById('sel-client').value;
  const csm = document.getElementById('inp-csm').value.trim();
  const errEl = document.getElementById('submit-error');
  errEl.textContent = '';

  if (!client) { errEl.textContent = 'Please select a client.'; return; }
  if (!csm) { errEl.textContent = 'Please enter your name.'; return; }

  const answered = CATS.reduce((a,c) => a + QUESTIONS[c].questions.filter(q => state.answers[q.id] !== undefined).length, 0);
  if (answered < TOTAL_QS && !confirm(`${TOTAL_QS - answered} question(s) unanswered. Submit anyway?`)) return;

  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = state.editingRecordId ? 'Saving...' : 'Submitting...';

  try {
    const scores = calcAllScores(state.answers);
    const reviewName = document.getElementById('inp-review-name').value.trim();

    if (state.editingRecordId) {
      await updateReview(state.editingRecordId, client, csm, reviewName, state.answers, scores);
    } else {
      await saveReview(client, csm, reviewName, state.answers, scores);
    }

    const wasEditing = !!state.editingRecordId;
    state.editingRecordId = null;
    document.getElementById('edit-banner').style.display = 'none';
    document.getElementById('review-layout').style.display = 'none';
    const ss = document.getElementById('success-state');
    ss.style.display = 'flex';
    document.getElementById('success-sub').textContent = `${client} · ${wasEditing ? 'Review updated' : new Date().toLocaleDateString('en-GB')}`;
  } catch(e) {
    errEl.textContent = 'Failed: ' + e.message;
    btn.disabled = false;
    btn.textContent = state.editingRecordId ? 'Save Changes' : 'Submit Review';
  }
}

function resetReview() {
  state.answers = {};
  state.activeCat = CATS[0];
  state.editingRecordId = null;
  document.getElementById('review-layout').style.display = 'flex';
  document.getElementById('success-state').style.display = 'none';
  document.getElementById('edit-banner').style.display = 'none';
  document.getElementById('sel-client').value = '';
  document.getElementById('inp-csm').value = '';
  document.getElementById('inp-review-name').value = '';
  document.getElementById('btn-submit').disabled = false;
  document.getElementById('btn-submit').textContent = 'Submit Review';
  buildSidebar();
  renderQuestions();
  updateNavButtons();
}

function onClientChange() {
  const sel = document.getElementById('sel-client');
  sel.className = sel.value ? '' : 'placeholder';
}

function populateClientSelects() {

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function refreshDashClientSelect() { populateClientSelects(); }

// ── SVG CHART HELPERS ─────────────────────────────────────────────────────────
function makeRadarSVG(reviews) {
  const cats = Object.keys(CAT_SCORE_FIELDS);
  const n = cats.length;
  const cx = 200, cy = 185, r = 130;
  const COLORS = ['#2a7fff','#1fd67a','#f5a623','#a78bfa','#f04b4b','#06b6d4','#fb923c'];
  const FILLS  = ['rgba(42,127,255,0.12)','rgba(31,214,122,0.1)','rgba(245,166,35,0.1)','rgba(167,139,250,0.1)','rgba(240,75,75,0.1)','rgba(6,182,212,0.1)','rgba(251,146,60,0.1)'];

  // Grid rings
  let gridLines = '';
  [25,50,75,100].forEach(pct => {
    const rr = r * pct / 100;
    const pts = cats.map((_,i) => {
      const a = (i/n)*2*Math.PI - Math.PI/2;
      return `${cx+rr*Math.cos(a)},${cy+rr*Math.sin(a)}`;
    }).join(' ');
    gridLines += `<polygon points="${pts}" fill="none" stroke="#1a3050" stroke-width="1"/>`;
    gridLines += `<text x="${cx+4}" y="${cy-rr+3}" font-size="8" fill="#1e3550" font-family="DM Mono,monospace">${pct}</text>`;
  });

  // Axis lines
  const axisLines = cats.map((_,i) => {
    const a = (i/n)*2*Math.PI - Math.PI/2;
    return `<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(a)}" y2="${cy+r*Math.sin(a)}" stroke="#1a3050" stroke-width="1"/>`;
  }).join('');

  // Data polygons — one per review
  const polygons = reviews.map((rev, ri) => {
    const f = rev.fields;
    const pts = cats.map((cat,i) => {
      const val = f[CAT_SCORE_FIELDS[cat]] || 0;
      const a = (i/n)*2*Math.PI - Math.PI/2;
      return `${cx+r*val*Math.cos(a)},${cy+r*val*Math.sin(a)}`;
    }).join(' ');
    const dots = cats.map((cat,i) => {
      const val = f[CAT_SCORE_FIELDS[cat]] || 0;
      const a = (i/n)*2*Math.PI - Math.PI/2;
      return `<circle cx="${cx+r*val*Math.cos(a)}" cy="${cy+r*val*Math.sin(a)}" r="3" fill="${COLORS[ri]}"/>`;
    }).join('');
    return `<polygon points="${pts}" fill="${FILLS[ri]}" stroke="${COLORS[ri]}" stroke-width="2"/>${dots}`;
  }).join('');

  // Axis labels (use last selected review for pct colour)
  const lastF = reviews[reviews.length-1].fields;
  const labels = cats.map((cat,i) => {
    const a = (i/n)*2*Math.PI - Math.PI/2;
    const lr = r + 26;
    const lx = cx + lr*Math.cos(a);
    const ly = cy + lr*Math.sin(a);
    const pct = Math.round((lastF[CAT_SCORE_FIELDS[cat]]||0)*100);
    const col = pct>=75?'#1fd67a':pct>=50?'#f5a623':'#f04b4b';
    return `<text x="${lx}" y="${ly-5}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#5a7a96" font-family="Outfit,sans-serif">${getCatShort(cat)}</text>
            <text x="${lx}" y="${ly+8}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="${col}" font-family="DM Mono,monospace" font-weight="500">${pct}%</text>`;
  }).join('');

  // Legend for multiple reviews
  const legendH = reviews.length > 1 ? reviews.length * 18 + 10 : 0;
  const legend = reviews.length > 1 ? reviews.map((rev,ri) => {
    const name = rev.fields["Review Name"] || rev.fields["Review Date"] || `Review ${ri+1}`;
    return `<rect x="10" y="${390+ri*18}" width="12" height="12" rx="2" fill="${COLORS[ri]}"/>
            <text x="26" y="${400+ri*18}" font-size="11" fill="#5a7a96" font-family="Outfit,sans-serif">${name}</text>`;
  }).join('') : '';

  const totalH = 390 + legendH;
  return `<svg width="400" height="${totalH}" viewBox="0 0 400 ${totalH}" style="width:100%;max-width:400px;display:block;margin:0 auto">
    ${gridLines}${axisLines}${polygons}${labels}${legend}
  </svg>`;
}

function makeTrendSVG(reviews) {
  if (reviews.length < 2) return '<div class="chart-placeholder"><div class="chart-placeholder-icon">📈</div><div class="chart-placeholder-text">Trend available after 2+ reviews</div></div>';
  
  const W = 500, H = 260, PAD = { top: 20, right: 20, bottom: 40, left: 35 };
  const plotW = W - PAD.left - PAD.right;
  const plotH = H - PAD.top - PAD.bottom;
  const cats = Object.keys(CAT_SCORE_FIELDS);
  const colors = ['#2a7fff','#1fd67a','#f5a623','#a78bfa','#f04b4b','#06b6d4','#fb923c'];
  const n = reviews.length;

  const xPos = i => PAD.left + (i / (n - 1)) * plotW;
  const yPos = v => PAD.top + plotH - (v / 100) * plotH;

  // Grid lines
  let grid = '';
  [0, 25, 50, 75, 100].forEach(v => {
    const y = yPos(v);
    grid += `<line x1="${PAD.left}" y1="${y}" x2="${W - PAD.right}" y2="${y}" stroke="#1a3050" stroke-width="1"/>`;
    grid += `<text x="${PAD.left - 4}" y="${y}" text-anchor="end" dominant-baseline="middle" font-size="9" fill="#3a5570" font-family="DM Mono,sans-serif">${v}</text>`;
  });

  // X labels
  let xLabels = reviews.map((r, i) => {
    const label = (r.fields["Review Date"] || `Rev ${i+1}`).slice(0, 10);
    return `<text x="${xPos(i)}" y="${H - 8}" text-anchor="middle" font-size="9" fill="#5a7a96" font-family="Outfit,sans-serif">${label}</text>`;
  }).join('');

  // Lines
  let lines = cats.map((cat, ci) => {
    const pts = reviews.map((r, i) => {
      const v = Math.round((r.fields[CAT_SCORE_FIELDS[cat]] || 0) * 100);
      return `${xPos(i)},${yPos(v)}`;
    }).join(' ');
    const dots = reviews.map((r, i) => {
      const v = Math.round((r.fields[CAT_SCORE_FIELDS[cat]] || 0) * 100);
      return `<circle cx="${xPos(i)}" cy="${yPos(v)}" r="3" fill="${colors[ci]}"/>`;
    }).join('');
    return `<polyline points="${pts}" fill="none" stroke="${colors[ci]}" stroke-width="2"/>${dots}`;
  }).join('');

  // Legend
  let legend = cats.map((cat, ci) => {
    const lx = PAD.left + (ci % 4) * 115;
    const ly = H + 15 + Math.floor(ci / 4) * 18;
    return `<rect x="${lx}" y="${ly - 5}" width="10" height="10" rx="2" fill="${colors[ci]}"/>
            <text x="${lx + 14}" y="${ly + 3}" font-size="10" fill="#5a7a96" font-family="Outfit,sans-serif">${getCatShort(cat)}</text>`;
  }).join('');

  const totalH = H + 15 + Math.ceil(cats.length / 4) * 18 + 10;
  return `<svg width="${W}" height="${totalH}" viewBox="0 0 ${W} ${totalH}" style="width:100%;display:block">
    ${grid}${lines}${xLabels}${legend}
  </svg>`;
}

async function loadDashboard() {
  const client = document.getElementById('dash-client').value;
  const content = document.getElementById('dashboard-content');
  const reviewSel = document.getElementById('dash-review');

  if (!client) {
    content.innerHTML = '<div class="no-review-state">Select a client to view their embeddedness scores.</div>';
    reviewSel.style.display = 'none';
    document.getElementById('review-check-panel').style.display = 'none';
    return;
  }

  content.innerHTML = '<div class="loading-state"><span class="spinner"></span>Loading reviews...</div>';

  try {
    state.dashReviews = await fetchReviews(client);
    if (state.dashReviews.length === 0) {
      content.innerHTML = '<div class="no-review-state">No reviews submitted yet for this client.</div>';
      reviewSel.style.display = 'none';
      return;
    }
    reviewSel.style.display = 'inline-block';
    // Build checkbox list for multi-review radar
    const checkContainer = document.getElementById('review-checks');
    checkContainer.innerHTML = state.dashReviews.map((r, i) => {
      const label = r.fields["Review Name"] || r.fields["Review Date"] || `Review ${i+1}`;
      const csm = r.fields.CSM || '';
      const checked = i === state.dashReviews.length - 1 ? 'checked' : '';
      return `<label class="review-check-label">
        <input type="checkbox" value="${i}" ${checked} onchange="renderDashboard()">
        <span class="review-check-name">${label}</span>
        <span class="review-check-csm">${csm}</span>
        <span class="review-check-actions">
          <button class="btn-edit-review" onclick="startEditReview(event, ${i})">Edit</button>
          <button class="btn-del-review" onclick="confirmDeleteReview(event, ${i})">Delete</button>
        </span>
      </label>`;
    }).join('');
    reviewSel.style.display = 'none';
    document.getElementById('review-check-panel').style.display = 'flex';
    renderDashboard();
  } catch(e) {
    content.innerHTML = `<div class="no-review-state">Error loading reviews: ${e.message}</div>`;
  }
}

function renderDashboard() {
  // Get selected review indices from checkboxes
  const checked = [...document.querySelectorAll('#review-checks input[type=checkbox]:checked')].map(cb => parseInt(cb.value));
  if (checked.length === 0) return;
  // Primary review is the last checked one for score cards and detail
  const idx = checked[checked.length - 1];
  const review = state.dashReviews[idx];
  if (!review) return;
  const f = review.fields;
  const selectedReviews = checked.map(i => state.dashReviews[i]);
  const content = document.getElementById('dashboard-content');

  // Scores object for radar
  const scores = {};
  Object.keys(CAT_SCORE_FIELDS).forEach(cat => { scores[cat] = f[CAT_SCORE_FIELDS[cat]] || 0; });

  // Score cards
  let scoreCardsHTML = Object.keys(CAT_SCORE_FIELDS).map(cat => {
    const pct = Math.round((f[CAT_SCORE_FIELDS[cat]] || 0) * 100);
    return `<div class="score-card">
      <div class="score-value" style="color:${scoreColor(pct)}">${pct}%</div>
      <div class="score-label">${getCatShort(cat)}</div>
    </div>`;
  }).join('');

  // Detail
  let detailHTML = CATS.map(cat => {
    const qs = QUESTIONS[cat].questions.map(q => {
      const val = f[q.id];
      const opt = val ? q.options.find(o => o.v === val) : null;
      const comment = f[q.id + '_comment'];
      return `<div class="detail-q">
        <div class="detail-q-row">
          <span class="detail-q-label">${q.label}</span>
          ${opt ? `<span class="detail-q-pts">${opt.pts}pts</span>` : ''}
        </div>
        ${opt ? `<div class="detail-q-answer">${opt.label}</div>` : '<div class="detail-q-empty">Not answered</div>'}
        ${comment ? `<div class="detail-q-comment">"${comment}"</div>` : ''}
      </div>`;
    }).join('');
    return `<div class="detail-cat">
      <div class="detail-cat-name">${cat}</div>${qs}
    </div>`;
  }).join('');

  content.innerHTML = `
    <div class="score-grid">${scoreCardsHTML}</div>
    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title">Category Scores — Current Review</div>
        ${makeRadarSVG(selectedReviews)}
      </div>
      <div class="chart-card">
        <div class="chart-title">Score Development Over Time</div>
        ${makeTrendSVG(state.dashReviews)}
      </div>
    </div>
    <div class="detail-card">
      <div class="detail-title">Question Detail</div>
      ${detailHTML}
    </div>`;
}

// ── QUESTION ADMIN ───────────────────────────────────────────────────────────
let allQuestionRecords = [];

async function manualSeed() {
  const btn = document.getElementById('btn-seed');
  const result = document.getElementById('seed-result');
  btn.disabled = true; btn.textContent = 'Seeding...';
  result.style.display = 'none';
  try {
    // Check if already seeded
    const existing = await loadAllQuestionRecords();
    if (existing.length > 0) {
      if (!confirm(`Questions table already has ${existing.length} records. Seed anyway (will add duplicates)?`)) {
        btn.disabled = false; btn.textContent = '↺ Seed Default Questions';
        return;
      }
    }
    await seedQuestions();
    await loadQuestions();
    buildSidebar(); renderQuestions();
    result.style.cssText = 'display:block;background:rgba(31,214,122,0.1);border:1px solid rgba(31,214,122,0.3);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--green);margin-bottom:12px';
    result.textContent = '✓ Questions seeded successfully — ' + TOTAL_QS + ' questions loaded';
    await renderQuestionsAdmin();
  } catch(e) {
    result.style.cssText = 'display:block;background:rgba(240,75,75,0.1);border:1px solid rgba(240,75,75,0.3);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--red);margin-bottom:12px';
    result.textContent = '✗ Seed failed: ' + e.message;
  }
  btn.disabled = false; btn.textContent = '↺ Seed Default Questions';
}

function showAdminTab(tab) {
  document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('atab-' + tab).classList.add('active');
  document.getElementById('admin-tab-clients').style.display = tab === 'clients' ? 'block' : 'none';
  document.getElementById('admin-tab-questions').style.display = tab === 'questions' ? 'block' : 'none';
  if (tab === 'questions') renderQuestionsAdmin();
}

async function renderQuestionsAdmin() {
  const container = document.getElementById('questions-admin-container');
  container.innerHTML = '<div class="loading-state"><span class="spinner"></span>Loading questions...</div>';
  try {
    allQuestionRecords = await loadAllQuestionRecords();
    buildQuestionsAdminUI(container);
  } catch(e) {
    container.innerHTML = `<div class="empty-state">Error: ${e.message}</div>`;
  }
}

function buildQuestionsAdminUI(container) {
  const active = allQuestionRecords.filter(r => r.fields.Active !== false);
  active.sort((a,b) => (a.fields["Category Order"]||99) - (b.fields["Category Order"]||99) || (a.fields["Question Order"]||99) - (b.fields["Question Order"]||99));

  // Group by category
  const cats = {};
  active.forEach(r => {
    const cat = r.fields["Category"] || "Uncategorised";
    if (!cats[cat]) cats[cat] = { order: r.fields["Category Order"]||99, records: [] };
    cats[cat].records.push(r);
  });

  let html = `<button class="btn-add-section" onclick="addNewSection()">+ Add New Section</button>`;

  for (const [cat, data] of Object.entries(cats)) {
    html += `<div class="q-admin-cat" id="qcat-${CSS.escape(cat)}">
      <div class="q-admin-cat-header" onclick="toggleCat('${cat.replace(/'/g,"\'")}')">
        <span class="q-admin-cat-name">${cat}</span>
        <span class="q-admin-cat-toggle">▾</span>
      </div>
      <div id="qcat-body-${cat.replace(/\s/g,'_')}" style="display:block">`;

    data.records.forEach(r => {
      let opts = [];
      try { opts = JSON.parse(r.fields["Options JSON"] || "[]"); } catch(e) {}
      const optsPreview = opts.map(o =>
        `<div class="q-admin-opt"><span class="q-admin-opt-v">${o.v}</span><span class="q-admin-opt-pts">${o.pts}pts</span><span>${o.label}</span></div>`
      ).join('');

      html += `<div class="q-admin-q" id="qrow-${r.id}">
        <div class="q-admin-q-row">
          <div style="flex:1">
            <div class="q-admin-q-label">${r.fields["Question Label"] || r.fields["Question ID"]}</div>
            <div class="q-admin-weight">Weight: ${Math.round((r.fields["Weight"]||0)*100)}% &nbsp;|&nbsp; ID: ${r.fields["Question ID"]}</div>
          </div>
          <div class="q-admin-q-actions">
            <button class="btn-q-edit" onclick="openQEdit('${r.id}')">Edit</button>
            <button class="btn-q-archive" onclick="archiveQ('${r.id}', '${(r.fields["Question Label"]||"").replace(/'/g,"\'")}')">Archive</button>
          </div>
        </div>
        <div class="q-admin-options">${optsPreview}</div>
        <div class="q-edit-form" id="qedit-${r.id}"></div>
      </div>`;
    });

    html += `<button class="btn-add-question" onclick="addNewQuestion('${cat.replace(/'/g,"\'")}', ${data.order})">+ Add Question to ${cat}</button>
      </div>
    </div>`;
  }

  container.innerHTML = html;
}

function toggleCat(cat) {
  const body = document.getElementById('qcat-body-' + cat.replace(/\s/g,'_'));
  if (body) body.style.display = body.style.display === 'none' ? 'block' : 'none';
}

function openQEdit(recordId) {
  // Close any other open editors
  document.querySelectorAll('.q-edit-form.open').forEach(f => { if (f.id !== 'qedit-' + recordId) { f.classList.remove('open'); f.innerHTML = ''; }});

  const form = document.getElementById('qedit-' + recordId);
  if (form.classList.contains('open')) { form.classList.remove('open'); form.innerHTML = ''; return; }

  const rec = allQuestionRecords.find(r => r.id === recordId);
  if (!rec) return;
  let opts = [];
  try { opts = JSON.parse(rec.fields["Options JSON"] || "[]"); } catch(e) {}

  form.innerHTML = buildQEditHTML(recordId, rec.fields, opts);
  form.classList.add('open');
}

function buildQEditHTML(recordId, fields, opts, isNew = false) {
  const optsHTML = opts.map((o, i) => `
    <div class="q-edit-opt-row" id="opt-row-${recordId}-${i}">
      <span class="lbl">Opt ${o.v}</span>
      <input type="text" value="${(o.label||'').replace(/"/g,'&quot;')}" id="opt-lbl-${recordId}-${i}" placeholder="Descriptor text">
      <span class="lbl">pts</span>
      <input type="number" value="${o.pts||0}" id="opt-pts-${recordId}-${i}" min="0" max="100">
      <button class="btn-rm-opt" onclick="removeOptRow('${recordId}', ${i})">×</button>
    </div>`).join('');

  return `
    <div class="q-edit-row">
      <label class="q-edit-label">Question Label</label>
      <input type="text" id="qf-label-${recordId}" value="${(fields["Question Label"]||'').replace(/"/g,'&quot;')}">
    </div>
    <div style="display:flex;gap:10px">
      <div class="q-edit-row" style="flex:1">
        <label class="q-edit-label">Question ID</label>
        <input type="text" id="qf-id-${recordId}" value="${fields["Question ID"]||''}">
      </div>
      <div class="q-edit-row" style="flex:1">
        <label class="q-edit-label">Weight (0–1)</label>
        <input type="number" id="qf-weight-${recordId}" value="${fields["Weight"]||0.5}" step="0.05" min="0" max="1">
      </div>
      <div class="q-edit-row" style="flex:1">
        <label class="q-edit-label">Order</label>
        <input type="number" id="qf-order-${recordId}" value="${fields["Question Order"]||1}" min="1">
      </div>
    </div>
    <label class="q-edit-label">Options</label>
    <div id="opts-container-${recordId}">${optsHTML}</div>
    <button class="btn-add-opt" onclick="addOptRow('${recordId}')">+ Add Option</button>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn-save-q" onclick="saveQEdit('${recordId}', ${isNew})">${isNew ? 'Create Question' : 'Save Changes'}</button>
      <button class="btn-cancel-q" onclick="cancelQEdit('${recordId}')">Cancel</button>
    </div>
    <div class="error-msg" id="qedit-err-${recordId}"></div>`;
}

function removeOptRow(recordId, idx) {
  const row = document.getElementById(`opt-row-${recordId}-${idx}`);
  if (row) row.remove();
}

function addOptRow(recordId) {
  const container = document.getElementById('opts-container-' + recordId);
  const existing = container.querySelectorAll('.q-edit-opt-row').length;
  const newV = existing + 1;
  const div = document.createElement('div');
  div.className = 'q-edit-opt-row';
  div.id = `opt-row-${recordId}-new-${newV}`;
  div.innerHTML = `
    <span class="lbl">Opt ${newV}</span>
    <input type="text" id="opt-lbl-${recordId}-new-${newV}" placeholder="Descriptor text">
    <span class="lbl">pts</span>
    <input type="number" id="opt-pts-${recordId}-new-${newV}" value="0" min="0" max="100">
    <button class="btn-rm-opt" onclick="this.parentElement.remove()">×</button>`;
  container.appendChild(div);
}

function cancelQEdit(recordId) {
  const form = document.getElementById('qedit-' + recordId);
  if (form) { form.classList.remove('open'); form.innerHTML = ''; }
}

async function saveQEdit(recordId, isNew = false) {
  const errEl = document.getElementById('qedit-err-' + recordId);
  errEl.textContent = '';

  const label = document.getElementById('qf-label-' + recordId).value.trim();
  const qid = document.getElementById('qf-id-' + recordId).value.trim();
  const weight = parseFloat(document.getElementById('qf-weight-' + recordId).value);
  const order = parseInt(document.getElementById('qf-order-' + recordId).value);

  if (!label || !qid) { errEl.textContent = 'Label and ID are required.'; return; }

  // Collect options
  const optRows = document.querySelectorAll(`#opts-container-${recordId} .q-edit-opt-row`);
  const opts = [];
  optRows.forEach((row, i) => {
    const lblEl = row.querySelector('input[type="text"]');
    const ptsEl = row.querySelector('input[type="number"]');
    if (lblEl && lblEl.value.trim()) {
      opts.push({ v: i+1, label: lblEl.value.trim(), pts: parseInt(ptsEl?.value||0) });
    }
  });

  if (opts.length < 1) { errEl.textContent = 'At least one option is required.'; return; }

  const fields = {
    "Question Label": label,
    "Question ID": qid,
    "Weight": weight,
    "Question Order": order,
    "Options JSON": JSON.stringify(opts),
    "Active": true
  };

  try {
    if (isNew) {
      await createQuestionRecord(fields);
    } else {
      await saveQuestionRecord(recordId, fields);
    }
    // Reload questions and rebuild UI
    await loadQuestions();
    buildSidebar();
    renderQuestions();
    await renderQuestionsAdmin();
  } catch(e) {
    errEl.textContent = 'Save failed: ' + e.message;
  }
}

async function archiveQ(recordId, label) {
  if (!confirm(`Archive "${label}"? It will no longer appear in score entry but historical data is preserved.`)) return;
  try {
    await archiveQuestionRecord(recordId);
    await loadQuestions();
    buildSidebar();
    renderQuestions();
    await renderQuestionsAdmin();
  } catch(e) {
    alert('Archive failed: ' + e.message);
  }
}

function addNewQuestion(cat, catOrder) {
  const tempId = 'new-' + Date.now();
  const container = document.getElementById('qcat-body-' + cat.replace(/\s/g,'_'));
  if (!container) return;

  const qCount = QUESTIONS[cat] ? QUESTIONS[cat].questions.length + 1 : 1;
  const div = document.createElement('div');
  div.className = 'q-admin-q';
  div.id = 'qrow-' + tempId;
  div.innerHTML = `<div class="q-admin-q-label" style="margin-bottom:8px;color:var(--accent-light)">New Question</div>
    <div class="q-edit-form open" id="qedit-${tempId}">
      ${buildQEditHTML(tempId, {
        "Question Label": "", "Question ID": "", "Weight": 0.5,
        "Question Order": qCount, "Category": cat, "Category Order": catOrder
      }, [{v:1,pts:0,label:""},{v:2,pts:50,label:""},{v:3,pts:100,label:""}], true)}
    </div>`;

  // Store category info so saveQEdit can use it
  div.dataset.cat = cat;
  div.dataset.catOrder = catOrder;
  container.insertBefore(div, container.lastElementChild);

  // Override save to include category fields
  const origSave = window.saveQEdit;
  div.querySelector('.btn-save-q').onclick = async () => {
    const errEl = document.getElementById('qedit-err-' + tempId);
    errEl.textContent = '';
    const label = document.getElementById('qf-label-' + tempId).value.trim();
    const qid = document.getElementById('qf-id-' + tempId).value.trim();
    const weight = parseFloat(document.getElementById('qf-weight-' + tempId).value);
    const order = parseInt(document.getElementById('qf-order-' + tempId).value);
    if (!label || !qid) { errEl.textContent = 'Label and ID are required.'; return; }
    const optRows = document.querySelectorAll(`#opts-container-${tempId} .q-edit-opt-row`);
    const opts = [];
    optRows.forEach((row, i) => {
      const lblEl = row.querySelector('input[type="text"]');
      const ptsEl = row.querySelector('input[type="number"]');
      if (lblEl && lblEl.value.trim()) opts.push({ v: i+1, label: lblEl.value.trim(), pts: parseInt(ptsEl?.value||0) });
    });
    if (opts.length < 1) { errEl.textContent = 'At least one option is required.'; return; }
    try {
      await createQuestionRecord({
        "Question Label": label, "Question ID": qid, "Weight": weight,
        "Question Order": order, "Category": cat, "Category Order": catOrder,
        "Options JSON": JSON.stringify(opts), "Active": true
      });
      await loadQuestions();
      buildSidebar(); renderQuestions();
      await renderQuestionsAdmin();
    } catch(e) { errEl.textContent = 'Create failed: ' + e.message; }
  };
}

function addNewSection() {
  const name = prompt("Enter section name:");
  if (!name || !name.trim()) return;
  const order = prompt("Enter section order (number):", "8");
  if (!order) return;

  // Create a placeholder question to establish the section
  createQuestionRecord({
    "Question Label": "New question — edit me",
    "Question ID": name.trim().replace(/\s/g,'').substring(0,3).toUpperCase() + "1",
    "Category": name.trim(),
    "Category Order": parseInt(order)||8,
    "Question Order": 1,
    "Weight": 0.5,
    "Options JSON": JSON.stringify([
      {v:1,pts:0,label:"Option 1"},
      {v:2,pts:50,label:"Option 2"},
      {v:3,pts:100,label:"Option 3"}
    ]),
    "Active": true
  }).then(async () => {
    await loadQuestions();
    buildSidebar(); renderQuestions();
    await renderQuestionsAdmin();
  }).catch(e => alert('Failed: ' + e.message));
}

// ── ADMIN ─────────────────────────────────────────────────────────────────────
function openAdmin() {
  document.getElementById('admin-modal').classList.add('open');
  if (state.adminAuthed) {
    showAdminMgmt();
  } else {
    document.getElementById('admin-login-screen').style.display = 'block';
    document.getElementById('admin-mgmt-screen').style.display = 'none';
    document.getElementById('modal-title').textContent = 'Admin Access';
    setTimeout(() => document.getElementById('admin-pwd').focus(), 100);
  }
}

function closeAdmin() {
  document.getElementById('admin-modal').classList.remove('open');
  document.getElementById('admin-pwd').value = '';
  document.getElementById('admin-error').textContent = '';
}

function tryAdminLogin() {
  const pwd = document.getElementById('admin-pwd').value;
  if (pwd === ADMIN_PASSWORD) {
    state.adminAuthed = true;
    showAdminMgmt();
  } else {
    document.getElementById('admin-error').textContent = 'Incorrect password';
    document.getElementById('admin-pwd').value = '';
  }
}

async function showAdminMgmt() {
  document.getElementById('admin-login-screen').style.display = 'none';
  document.getElementById('admin-mgmt-screen').style.display = 'block';
  document.getElementById('modal-title').textContent = 'Admin';
  showAdminTab('clients');
  await refreshClientList();
}

async function refreshClientList() {
  const container = document.getElementById('client-list-container');
  container.innerHTML = '<div class="loading-state"><span class="spinner"></span>Loading...</div>';
  try {
    await loadClients();
    populateClientSelects();
    if (state.clients.length === 0) {
      container.innerHTML = '<div class="empty-state">No clients yet — add one above.</div>';
      return;
    }
    container.innerHTML = '<div class="client-list">' +
      state.clients.map(c => `
        <div class="client-item">
          <div><div class="client-item-name">${c.name}</div><div class="client-item-csm">${c.csm}</div></div>
          <button class="btn-remove" onclick="deleteClient('${c.id}','${c.name}')">Remove</button>
        </div>`).join('') +
      '</div>';
  } catch(e) {
    container.innerHTML = `<div class="empty-state">Error: ${e.message}</div>`;
  }
}

async function addClient() {
  const name = document.getElementById('new-client-name').value.trim();
  const csm = document.getElementById('new-csm-name').value.trim();
  const errEl = document.getElementById('add-error');
  errEl.textContent = '';
  if (!name || !csm) { errEl.textContent = 'Both fields are required.'; return; }

  const btn = document.getElementById('btn-add-client');
  btn.disabled = true; btn.textContent = '...';

  try {
    await createClient(name, csm);
    document.getElementById('new-client-name').value = '';
    document.getElementById('new-csm-name').value = '';
    await refreshClientList();
  } catch(e) {
    errEl.textContent = 'Failed: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Add';
}

async function deleteClient(id, name) {
  if (!confirm(`Remove "${name}"?`)) return;
  try {
    await removeClient(id);
    await refreshClientList();
  } catch(e) {
    alert('Failed to remove: ' + e.message);
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    await loadQuestions();
  } catch(e) {
    console.error('loadQuestions failed:', e.message);
    // Fall back to seed questions if Airtable unavailable
    QUESTIONS = JSON.parse(JSON.stringify(SEED_QUESTIONS));
    refreshQuestionMeta();
    // Show visible error for debugging
    const errDiv = document.createElement('div');
    errDiv.style.cssText = 'position:fixed;bottom:10px;right:10px;background:#f04b4b;color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;z-index:999;max-width:400px';
    errDiv.textContent = 'Questions load error: ' + e.message;
    document.body.appendChild(errDiv);
    setTimeout(() => errDiv.remove(), 10000);
  }
  state.activeCat = CATS[0];
  buildSidebar();
  renderQuestions();
  updateNavButtons();
  try {
    await loadClients();
    populateClientSelects();
  } catch(e) {
    console.warn('Could not load clients on init:', e.message);
  }
}

init();
